name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. v1.4.5)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Set version
        # Pass event data via env, not ${{ }} interpolation inside run:, so a
        # crafted tag name / dispatch input cannot inject shell commands.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$RELEASE_TAG"
          fi
          # Accept the suffixed hotfix form (v1.4.1a) that the shell scripts'
          # _ct_validate_version and the README both allow.
          if ! printf '%s' "$VERSION" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+[a-z]?$'; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          # A suffixed hotfix is not valid semver: npm silently rewrites 1.4.1a
          # to the prerelease 1.4.1-a, which sorts *below* 1.4.1 and would make
          # `npm install caffeinate-timer` resolve to a lower version than the
          # release it fixes.  Publish only plain X.Y.Z; suffixed hotfixes are
          # distributed via the GitHub release and /update instead.
          if printf '%s' "$VERSION" | grep -Eq '[a-z]$'; then
            echo "PUBLISH_TO_NPM=false" >> "$GITHUB_ENV"
            echo "Suffixed hotfix $VERSION — skipping npm publish (GitHub release only)."
            exit 0
          fi
          echo "PUBLISH_TO_NPM=true" >> "$GITHUB_ENV"
          npm pkg set version="${VERSION#v}"

      - name: Publish to npm
        if: env.PUBLISH_TO_NPM == 'true'
        run: |
          # setup-node sets NODE_AUTH_TOKEN to GITHUB_TOKEN via GITHUB_ENV,
          # which step-level env: cannot override. Unset at shell level so npm
          # falls through to OIDC exchange (Trusted Publishing).
          unset NODE_AUTH_TOKEN
          unset NPM_CONFIG_USERCONFIG
          npm publish --provenance