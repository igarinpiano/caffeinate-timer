name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # pwsh は windows/macos ランナーには標準で入っている。
      # ubuntu では無いので入れておく（無くても該当テストがスキップされるだけ）。
      - name: Install PowerShell (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo snap install powershell --classic || echo "pwsh unavailable; those checks will skip"

      - name: Install extra locales (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo locale-gen en_US.UTF-8 ja_JP.UTF-8 de_DE.UTF-8 || true
          sudo update-locale || true

      - name: Run tests
        run: tests/run.sh
